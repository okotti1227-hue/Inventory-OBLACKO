<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инвентаризация Техники</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; }
        .card { background: white; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="p-4">

    <div id="app" class="max-w-md mx-auto">
        <!-- Загрузка -->
        <div id="loader" class="text-center mt-20 text-gray-500">Загрузка данных...</div>

        <!-- Карточка предмета -->
        <div id="content" class="hidden">
            <div class="card p-5 mb-4">
                <img id="itemPhoto" src="" alt="Фото" class="w-full h-64 object-cover rounded-lg mb-4">
                <h1 id="itemName" class="text-2xl font-bold text-gray-800"></h1>
                <p id="itemDesc" class="text-gray-600 mt-2 text-sm"></p>
            </div>

            <div class="card p-5 mb-4">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-gray-500 uppercase text-xs font-bold">Текущее место</span>
                    <span id="itemLocation" class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm"></span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-500 uppercase text-xs font-bold">Статус</span>
                    <span id="itemStatus" class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm"></span>
                </div>
            </div>

            <!-- Кнопки управления -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="updateData('status', 'В ремонте')" class="bg-red-500 text-white p-3 rounded-xl font-medium shadow-lg shadow-red-200">🛠 В ремонт</button>
                <button onclick="updateData('status', 'В порядке')" class="bg-green-600 text-white p-3 rounded-xl font-medium shadow-lg shadow-green-200">✅ В порядке</button>
                <button onclick="updateData('location', 'Зал')" class="bg-gray-800 text-white p-3 rounded-xl font-medium">📍 В зал</button>
                <button onclick="updateData('location', 'Кухня')" class="bg-gray-800 text-white p-3 rounded-xl font-medium">🍳 На кухню</button>
            </div>
        </div>

        <div id="error" class="hidden text-center mt-20 text-red-500">Предмет не найден. Отсканируйте правильный QR-код.</div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ТВОЙ КОНФИГ
        const firebaseConfig = {
            apiKey: "AIzaSyBiVHV3P7UT1Mj9MIn2NzjVSmBmCLi7WmY",
            authDomain: "oblacko-9fcac.firebaseapp.com",
            databaseURL: "https://oblacko-9fcac-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "oblacko-9fcac",
            storageBucket: "oblacko-9fcac.firebasestorage.app",
            messagingSenderId: "1005381172072",
            appId: "1:1005381172072:web:b4ae3f2c71e5001f3b74dd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Получаем ID из URL (например: ?id=001)
        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('id');

        if (itemId) {
            const itemRef = ref(db, 'items/' + itemId);
            onValue(itemRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('itemName').innerText = data.name || "Без названия";
                    document.getElementById('itemDesc').innerText = data.desc || "";
                    document.getElementById('itemLocation').innerText = data.location || "Не указано";
                    document.getElementById('itemStatus').innerText = data.status || "Неизвестно";
                    document.getElementById('itemPhoto').src = data.photo || "https://via.placeholder.com/400";
                    
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('content').classList.remove('hidden');
                } else {
                    showError();
                }
            });
        } else {
            showError();
        }

        function showError() {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
        }

        // Функция обновления (доступна глобально)
        window.updateData = function(field, value) {
            const updates = {};
            updates[field] = value;
            update(ref(db, 'items/' + itemId), updates);
        };
    </script>
</body>
</html>
