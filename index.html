<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Инвентарь ОБЛАКО (Dark)</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --ob-blue: #0A84FF;
            --ob-bg: #121212;
            --ob-card: #1C1C1E;
            --ob-border: #3A3A3C;
            --ob-text: #FFFFFF;
            --ob-text-secondary: #8E8E93;
            --ob-red: #FF453A;
            --ob-green: #30D158;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--ob-bg); color: var(--ob-text); min-height: 100vh; }

        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        .login-card { background: var(--ob-card); padding: 30px; border-radius: 16px; border: 1px solid var(--ob-border); width: 100%; max-width: 350px; text-align: center; }

        #main-app { display: none; padding-bottom: 80px; }
        .container { max-width: 700px; margin: 0 auto; padding: 10px; }
        
        header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--ob-border); margin-bottom: 15px; }
        .header-title { font-size: 1.2rem; font-weight: bold; color: var(--ob-blue); text-transform: uppercase; letter-spacing: 1px; }
        .logout-btn { justify-self: end; background: none; border: 1px solid var(--ob-border); color: var(--ob-text-secondary); padding: 5px 12px; cursor: pointer; font-size: 0.75rem; border-radius: 8px; }

        .online-status-box { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; font-weight: bold; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #48484A; }
        .dot.active { background: var(--ob-green); box-shadow: 0 0 10px var(--ob-green); }

        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-card { background: var(--ob-card); padding: 12px 5px; border-radius: 12px; text-align: center; border: 1px solid var(--ob-border); cursor: pointer; transition: 0.2s; }
        .stat-card.active-filter { border-color: var(--ob-blue); background: #0A84FF22; }
        .stat-number { font-size: 1.3rem; font-weight: bold; color: var(--ob-text); }
        .stat-label { font-size: 0.65rem; text-transform: uppercase; color: var(--ob-text-secondary); margin-top: 4px; }

        .search-box { width: 100%; padding: 14px; border: 1px solid var(--ob-border); border-radius: 12px; margin-bottom: 15px; outline: none; font-size: 1rem; background: var(--ob-card); color: var(--ob-text); }
        .search-box::placeholder { color: #545456; }

        .item-card { background: var(--ob-card); border-radius: 16px; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--ob-border); cursor: pointer; position: relative; }
        .item-image-container { width: 100%; height: 180px; background: #000; display: flex; align-items: center; justify-content: center; }
        .item-image { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
        .item-content { padding: 15px; }
        .item-content b { font-size: 1.1rem; display: block; margin-bottom: 4px; }
        .item-content small { color: var(--ob-text-secondary); font-size: 0.85rem; }
        .status-badge { position: absolute; top: 12px; right: 12px; padding: 5px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: bold; z-index: 5; background: var(--ob-red); color: white; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; overflow-y: auto; }
        .modal.active { display: block; }
        .modal-content { background: var(--ob-bg); width: 100%; min-height: 100vh; padding: 25px; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 2.2rem; border: none; background: none; color: var(--ob-text); cursor: pointer; }

        .btn-action { padding: 15px; border: 1px solid var(--ob-blue); border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; background: transparent; color: var(--ob-blue); font-size: 1rem; }
        .btn-green { background: var(--ob-blue); color: white; border: none; }
        .btn-danger { color: var(--ob-red); border-color: var(--ob-red); }

        .fab { position: fixed; bottom: 25px; right: 25px; width: 64px; height: 64px; background: var(--ob-blue); color: white; border-radius: 50%; border: none; font-size: 2rem; box-shadow: 0 8px 20px rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .fab-menu { position: fixed; bottom: 100px; right: 25px; display: none; flex-direction: column; gap: 12px; z-index: 1000; }
        .fab-menu.active { display: flex; }
        .fab-item { background: var(--ob-card); color: var(--ob-text); padding: 14px 22px; border-radius: 14px; font-weight: bold; border: 1px solid var(--ob-border); text-align: center; }

        .loader-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--ob-bg); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:9999; }
    </style>
</head>
<body>

    <div id="loader" class="loader-overlay"><h2 style="color:var(--ob-blue)">ОБЛАКО...</h2></div>

    <div id="login-screen">
        <div class="login-card">
            <div style="font-size: 3rem; margin-bottom: 10px;">☁️</div>
            <h1 style="color: var(--ob-text); margin-bottom: 25px; letter-spacing: 1px;">ОБЛАКО</h1>
            <input type="text" id="user-login" class="search-box" placeholder="Логин">
            <input type="password" id="user-pass" class="search-box" placeholder="Пароль">
            <button class="btn-action btn-green" onclick="checkAccess()">ВОЙТИ</button>
        </div>
    </div>

    <div id="main-app">
        <div class="container">
            <header>
                <div class="online-status-box"><div id="statusDot" class="dot"></div><span id="statusLabel" style="color:var(--ob-text-secondary)">OFFLINE</span></div>
                <div class="header-title">ОБЛАКО</div>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </header>

            <div class="stats-bar">
                <div class="stat-card" id="btn-all" onclick="setStatFilter('all')"><div class="stat-number" id="totalItems">0</div><div class="stat-label">Всего</div></div>
                <div class="stat-card" id="btn-ok" onclick="setStatFilter('ok')"><div class="stat-number" id="okItems">0</div><div class="stat-label">ОК</div></div>
                <div class="stat-card" id="btn-repair" onclick="setStatFilter('repair')"><div class="stat-number" id="repairItems">0</div><div class="stat-label">Ремонт</div></div>
            </div>

            <input type="text" class="search-box" id="searchInput" placeholder="Поиск..." onkeyup="renderItems()">
            <div id="itemsContainer"></div>
        </div>

        <button class="fab" onclick="document.getElementById('fabMenu').classList.toggle('active')">+</button>
        <div class="fab-menu" id="fabMenu">
            <button class="fab-item" onclick="openAddModal()">📦 Добавить объект</button>
            <button class="fab-item" onclick="openScanner()">📷 Сканер QR</button>
            <button class="fab-item" onclick="exportToExcel()">📊 Отчет Excel</button>
        </div>
    </div>

    <div id="addModal" class="modal"><div class="modal-content">
        <button class="close-btn" onclick="closeModal('addModal')">&times;</button>
        <h2 style="margin-bottom:20px;">Новый объект</h2>
        <input type="text" id="addId" class="search-box" style="color:var(--ob-blue); font-weight:bold" readonly>
        <input type="text" id="itemName" class="search-box" placeholder="Название">
        <select id="itemLocation" class="search-box">
            <option value="Зал">Зал</option><option value="Кухня">Кухня</option><option value="Бар">Бар</option><option value="Склад">Склад</option>
        </select>
        <input type="text" id="itemSub" class="search-box" placeholder="Категория">
        <input type="file" id="itemPhoto" class="search-box" accept="image/*">
        <button class="btn-action btn-green" onclick="saveNewItem()">СОХРАНИТЬ</button>
    </div></div>

    <div id="itemModal" class="modal"><div class="modal-content" id="itemModalContent"></div></div>
    <div id="scannerModal" class="modal"><div class="modal-content"><button class="close-btn" onclick="closeScanner()">&times;</button><div id="reader"></div></div></div>

    <script>
        // ОБНОВЛЕННЫЕ ЛОГИНЫ
        const USERS = { 
            "Tima": "Oblacko1994", 
            "Artem": "Oblacko2024", 
            "Stetxem": "Oblacko2025" 
        };

        const firebaseConfig = {
            apiKey: "AIzaSyBiVHV3P7UT1Mj9MIn2NzjVSmBmCLi7WmY",
            authDomain: "oblacko-9fcac.firebaseapp.com",
            databaseURL: "https://oblacko-9fcac-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "oblacko-9fcac",
            storageBucket: "oblacko-9fcac.firebasestorage.app",
            messagingSenderId: "1005381172072",
            appId: "1:1005381172072:web:b4ae3f2c71e5001f3b74dd"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let items = [], globalStatusFilter = 'all', html5QrCode = null;

        function checkAccess() {
            const l = document.getElementById('user-login').value.trim();
            const p = document.getElementById('user-pass').value.trim();
            if (USERS[l] === p) {
                localStorage.setItem('ob_auth', 'true');
                showApp();
            } else alert("Неверный логин или пароль!");
        }
        function logout() { localStorage.removeItem('ob_auth'); location.reload(); }
        if (localStorage.getItem('ob_auth') === 'true') showApp();

        function showApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            db.ref('items').on('value', snap => {
                items = snap.val() ? Object.values(snap.val()) : [];
                renderItems(); updateStats();
                const urlId = new URLSearchParams(window.location.search).get('id');
                if (urlId) showItemDetail(urlId);
            });
            db.ref('.info/connected').on('value', snap => {
                const dot = document.getElementById('statusDot'), label = document.getElementById('statusLabel');
                if (snap.val()) { dot.classList.add('active'); label.innerText = 'ONLINE'; } 
                else { dot.classList.remove('active'); label.innerText = 'OFFLINE'; }
            });
        }

        async function saveNewItem() {
            const id = document.getElementById('addId').value, name = document.getElementById('itemName').value;
            const loc = document.getElementById('itemLocation').value, sub = document.getElementById('itemSub').value;
            const file = document.getElementById('itemPhoto').files[0];
            if (!name) return alert("Введите название!");
            document.getElementById('loader').style.display = 'flex';
            let photo = 'https://via.placeholder.com/400x200/1C1C1E/FFFFFF?text=НЕТ+ФОТО';
            if (file) photo = await new Promise(res => { const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsDataURL(file); });
            await db.ref('items/' + id).set({ id, name, location: loc, sub: sub || "Общее", photo, status: 'ok', addedDate: new Date().toLocaleDateString() });
            document.getElementById('loader').style.display = 'none';
            closeModal('addModal');
        }

        function renderItems() {
            const container = document.getElementById('itemsContainer'), search = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';
            const filtered = items.filter(i => {
                const mSearch = i.name.toLowerCase().includes(search) || i.id.toLowerCase().includes(search) || i.location.toLowerCase().includes(search);
                const mFilter = globalStatusFilter === 'all' ? true : i.status === globalStatusFilter;
                return mSearch && mFilter;
            });
            filtered.forEach(item => {
                const div = document.createElement('div'); div.className = 'item-card'; div.onclick = () => showItemDetail(item.id);
                const st = item.status === 'repair' ? '<div class="status-badge">РЕМОНТ</div>' : '';
                div.innerHTML = `${st}<div class="item-image-container"><img src="${item.photo}" class="item-image"></div><div class="item-content"><b>${item.name}</b><small>ID: ${item.id} | 📍 ${item.location}</small></div>`;
                container.appendChild(div);
            });
        }

        function showItemDetail(id) {
            const item = items.find(i => i.id === id); if (!item) return;
            document.getElementById('itemModalContent').innerHTML = `
                <button class="close-btn" onclick="closeModal('itemModal')">&times;</button>
                <img src="${item.photo}" style="width:100%; height:300px; object-fit:contain; background:#000; border-radius:16px; margin-bottom:20px;">
                <h1 style="margin-bottom:10px;">${item.name}</h1>
                <p style="color:var(--ob-text-secondary); margin-bottom:20px;">ID: ${item.id} | Категория: ${item.sub} | Локация: ${item.location}</p>
                <div style="display:grid; gap:10px;">
                    <button class="btn-action btn-green" onclick="upStat('${item.id}', 'ok')">✅ ИСПРАВНО</button>
                    <button class="btn-action btn-danger" onclick="upStat('${item.id}', 'repair')">🔧 В РЕМОНТ</button>
                    <button class="btn-action" style="border-color:#48484A; color:#8E8E93" onclick="deleteItem('${item.id}')">🗑 УДАЛИТЬ</button>
                </div>
            `;
            document.getElementById('itemModal').classList.add('active');
        }

        function upStat(id, s) { db.ref('items/' + id).update({ status: s }); closeModal('itemModal'); }
        async function deleteItem(id) { if(confirm("Удалить предмет?")) { await db.ref('items/' + id).remove(); closeModal('itemModal'); } }
        function setStatFilter(s) { globalStatusFilter = s; renderItems(); }
        function openAddModal() { document.getElementById('addId').value = 'OB-' + Math.floor(1000 + Math.random() * 9000); document.getElementById('addModal').classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function updateStats() {
            document.getElementById('totalItems').innerText = items.length;
            document.getElementById('okItems').innerText = items.filter(i => i.status === 'ok').length;
            document.getElementById('repairItems').innerText = items.filter(i => i.status === 'repair').length;
        }

        function openScanner() { 
            document.getElementById('scannerModal').classList.add('active'); 
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, t => {
                const id = t.split('id=')[1] || t;
                closeScanner(); showItemDetail(id);
            });
        }
        function closeScanner() { if(html5QrCode) html5QrCode.stop(); closeModal('scannerModal'); }
        function exportToExcel() { const ws = XLSX.utils.json_to_sheet(items); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Inventory"); XLSX.writeFile(wb, "OBLACKO_Report.xlsx"); }
    </script>
</body>
</html>
