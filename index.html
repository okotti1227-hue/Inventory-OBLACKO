<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Инвентарь Облако | OBLACKO</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --oko-green: #8C916C;
            --oko-beige: #2D2D2D;
            --oko-brown: #E0E0E0;
            --oko-white: #121212;
            --oko-card-bg: #1E1E1E;
            --oko-red: #ff4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--oko-white); color: var(--oko-brown); min-height: 100vh; }

        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        .login-card { background: var(--oko-card-bg); padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 350px; text-align: center; border: 1px solid var(--oko-beige); }

        #main-app { display: none; padding-bottom: 80px; }
        .container { max-width: 700px; margin: 0 auto; padding: 10px; }
        
        header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--oko-beige); margin-bottom: 15px; }
        .header-title { font-size: 1.2rem; font-weight: bold; color: var(--oko-green); text-transform: uppercase; }
        .logout-btn { justify-self: end; background: none; border: 1px solid var(--oko-red); color: var(--oko-red); padding: 5px 10px; cursor: pointer; font-size: 0.75rem; border-radius: 4px; }

        .search-box { width: 100%; padding: 12px; border: 1px solid var(--oko-beige); margin-bottom: 15px; background: #252525; color: white; border-radius: 4px; font-size: 1rem; outline: none; }
        .btn-action { padding: 12px; border: 1px solid var(--oko-green); border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 8px; text-transform: uppercase; background: transparent; color: var(--oko-green); }
        .btn-green { background: var(--oko-green); color: #121212; border: none; }

        .item-card { background: var(--oko-card-bg); border-radius: 4px; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--oko-beige); padding-bottom: 10px; }
        .item-image { width: 100%; height: 250px; object-fit: contain; background: #000; }
        .item-content { padding: 12px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; overflow-y: auto; }
        .modal.active { display: block; }
        .modal-content { background: var(--oko-white); min-height: 100vh; padding: 20px; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 2.5rem; color: #fff; background: none; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Экран входа -->
    <div id="login-screen">
        <div class="login-card">
            <h1 style="color: var(--oko-green); margin-bottom: 20px;">OBLACKO</h1>
            <input type="text" id="user-login" class="search-box" placeholder="Логин">
            <input type="password" id="user-pass" class="search-box" placeholder="Пароль">
            <button class="btn-action btn-green" onclick="checkAccess()">ВОЙТИ</button>
        </div>
    </div>

    <!-- Основное приложение -->
    <div id="main-app">
        <div class="container">
            <header>
                <div></div>
                <div class="header-title">Инвентарь</div>
                <button class="logout-btn" onclick="logout()">Выход</button>
            </header>

            <input type="text" class="search-box" id="searchInput" placeholder="Поиск..." oninput="renderItems()">
            
            <div style="margin-bottom: 15px;">
                <button class="btn-action btn-green" onclick="openAddModal()">+ Добавить предмет</button>
            </div>

            <div id="itemsContainer"></div>
        </div>
    </div>

    <!-- Модалка добавления -->
    <div id="addModal" class="modal"><div class="modal-content">
        <button class="close-btn" onclick="closeModal('addModal')">&times;</button>
        <h2 style="color:var(--oko-green)">НОВЫЙ ОБЪЕКТ</h2><br>
        <input type="text" id="itemName" class="search-box" placeholder="Название">
        <select id="itemLocation" class="search-box">
            <option value="Зал">Зал</option><option value="Кухня">Кухня</option><option value="Бар">Бар</option><option value="Склад">Склад</option>
        </select>
        <button class="btn-action btn-green" onclick="saveNewItem()">СОХРАНИТЬ</button>
    </div></div>

    <script>
        // Данные пользователей
        const USERS = { "tima": "oblacko1994", "artem": "oblacko2024", "stetxem": "oblacko2025", "amir": "oblacko2026" };

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAk1A8PBDpSQjjiFoKyprSvzK4jO9Us_34",
            authDomain: "inventory-oko.firebaseapp.com",
            databaseURL: "https://inventory-oko-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "inventory-oko",
            storageBucket: "inventory-oko.firebasestorage.app",
            messagingSenderId: "528327448142",
            appId: "1:528327448142:web:c0bde5327bd1464c81951f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let items = [];

        // ФУНКЦИЯ ВХОДА
        function checkAccess() {
            const l = document.getElementById('user-login').value.trim().toLowerCase();
            const p = document.getElementById('user-pass').value.trim();

            if (USERS[l] && USERS[l] === p) {
                localStorage.setItem('oko_auth', 'true');
                localStorage.setItem('oko_user', l);
                showApp();
            } else {
                alert("Ошибка: Неверный логин или пароль!");
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        function showApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            
            // Загрузка данных
            db.ref('oblako_inventory').on('value', snap => {
                items = snap.val() ? Object.values(snap.val()) : [];
                renderItems();
            });
        }

        // Проверка при загрузке страницы
        if (localStorage.getItem('oko_auth') === 'true') {
            showApp();
        }

        function renderItems() {
            const container = document.getElementById('itemsContainer');
            const search = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            const filtered = items.filter(i => i.name.toLowerCase().includes(search));

            filtered.forEach(it => {
                const div = document.createElement('div');
                div.className = 'item-card';
                div.innerHTML = `
                    <img src="${it.photo || 'https://via.placeholder.com/400'}" class="item-image">
                    <div class="item-content">
                        <strong style="color:var(--oko-green); font-size:1.1rem;">${it.name}</strong><br>
                        <span style="color:#aaa;">ID: ${it.id} | 📍 ${it.location}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function openAddModal() {
            document.getElementById('addModal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function saveNewItem() {
            const name = document.getElementById('itemName').value;
            const loc = document.getElementById('itemLocation').value;
            const id = 'OBL-' + Math.floor(Math.random() * 10000);

            if(!name) return alert("Введите название!");

            db.ref('oblako_inventory/' + id).set({
                id: id,
                name: name,
                location: loc,
                photo: 'https://via.placeholder.com/400?text=OBLACKO',
                status: 'ok'
            }).then(() => {
                closeModal('addModal');
                document.getElementById('itemName').value = '';
            });
        }
    </script>
</body>
</html>
